<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Границы полей — сравнение</title><style>body{margin:0;background:#f2ede3;color:#17140f;font:16px/1.5 system-ui,sans-serif}header{max-width:900px;margin:20px auto;padding:0 16px}h1{font-size:25px;margin:0 0 8px}p{margin:8px 0}button{font:inherit;border:1px solid #8e806b;border-radius:8px;padding:10px 16px;background:#fffdf8;color:#17140f;cursor:pointer}button[aria-pressed=true]{background:#17140f;color:white}nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}iframe{display:block;width:min(100%,940px);height:1100px;margin:auto;border:0}#current{font-weight:650}</style><header><h1>Два варианта границ полей</h1><p>Меняется только цвет рамки толщиной 1 px. Размеры, фон, шрифт и расположение остаются прежними.</p><nav><button id="original" aria-pressed="true">Исходный макет · 1,35:1</button><button id="accessible" aria-pressed="false">Контрастнее · 3,50:1</button><button id="screen">Показать форму сбора</button></nav><p id="current">Сейчас: исходный макет</p><p>Это сравнение макетов. Данные никуда не отправляются и не сохраняются.</p></header><iframe id="view" title="Предпросмотр оформления" src="./?screen=branding&amp;clean=1"></iframe><script>const frame=document.getElementById('view');let enhanced=false,screen='branding';function apply(){const d=frame.contentDocument;if(!d)return;d.querySelector('.cab-notice')?.style.setProperty('display','none','important');d.querySelector('#preview-tools')?.style.setProperty('display','none','important');let s=d.getElementById('contrast-choice');if(!enhanced){s?.remove()}else if(!s){s=d.createElement('link');s.id='contrast-choice';s.rel='stylesheet';s.href='/__design/proofo/contrast-fields.override.css';d.head.appendChild(s)}document.getElementById('original').setAttribute('aria-pressed',String(!enhanced));document.getElementById('accessible').setAttribute('aria-pressed',String(enhanced));document.getElementById('current').textContent=enhanced?'Сейчас: более контрастные границы':'Сейчас: исходный макет'}frame.addEventListener('load',apply);document.getElementById('original').onclick=()=>{enhanced=false;apply()};document.getElementById('accessible').onclick=()=>{enhanced=true;apply()};document.getElementById('screen').onclick=()=>{screen=screen==='branding'?'collect':'branding';frame.src='./?screen='+screen+'&clean=1';document.getElementById('screen').textContent=screen==='branding'?'Показать форму сбора':'Показать оформление'};</script></html>
